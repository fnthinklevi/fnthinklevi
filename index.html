<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>fnthinklevi · GitHub Profile（本地实现）</title>
<link rel="stylesheet" href="assets/style.css?v=3">
</head>
<body>

<div id="header-wave"></div>

<main class="page">
  <div id="typing" class="typing-wrap"></div>
  <div id="badge-row" class="badge-row"></div>

  <section id="sec-skills">
    <h2 class="section-title"><span class="title-icon" data-icon="robot"></span>Skills &amp; Tools</h2>
    <div id="skill-grid" class="skill-grid"></div>
  </section>

  <section id="sec-contrib">
    <h2 class="section-title">
      <span class="title-icon" data-icon="sparkle-green"></span>Contributions<span class="title-icon" data-icon="sparkle-green"></span>
    </h2>
    <div id="summary-cards" class="cards-row"></div>
  </section>

  <section id="sec-activity">
    <h2 class="section-title">
      <span class="title-icon" data-icon="sparkle-purple"></span>GitHub Activity<span class="title-icon" data-icon="sparkle-purple"></span>
    </h2>
    <div id="snake" class="full-card"></div>
    <div id="profile-details" class="full-card"></div>
    <div id="contrib3d" class="full-card"></div>
  </section>

  <p class="thanks">Thanks for visiting — let's build something intelligent together.</p>
</main>

<div id="footer-wave"></div>

<script src="assets/config.js?v=3"></script>
<script src="assets/icons.js?v=3"></script>
<script src="assets/widgets.js?v=3"></script>
<script src="assets/cards.js?v=3"></script>
<script src="assets/app.js?v=3"></script>
</body>
</html>
